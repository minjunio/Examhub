# Render Blueprint — https://dashboard.render.com/blueprints
# Connect this repo, then set env vars in the dashboard (see .env.example).

services:
  - type: web
    name: examhub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build:render
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
